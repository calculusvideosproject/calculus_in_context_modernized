<figure class="listing figure-like"><figcaption><span class="type">Listing</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">1.3.1<span class="period heading-divison-mark heading-divison-mark__period">.</span></span><span class="space heading-divison-mark heading-divison-mark__space"> </span>Program: SIR<div class="autopermalink" aria-hidden="true" data-description="Listing 1.3.1: Program: SIR"><a tabindex="-1" href="#sirprogram" title="Copy heading and permalink for Listing 1.3.1: Program: SIR" aria-label="Copy heading and permalink for Listing 1.3.1: Program: SIR">🔗</a></div></figcaption><div class="listing__contents"><div class="code-box"><pre class="program clipboardable"><code class="language-none">t = 0
S = 45400
I = 2100
R = 2500
deltat = 1
PRINT t, S, I, R
FOR k = 1 TO 3
        Sprime = -.00001 * S * I
        Iprime = .00001 * S * I - I / 14
        Rprime = I / 14
        deltaS = Sprime * deltat
        deltaI = Iprime * deltat
        deltaR = Rprime * deltat
        t = t + deltat
        S = S + deltaS
        I = I + deltaI
        R = R + deltaR
        PRINT t, S, I, R
NEXT k
</code></pre></div></div>
