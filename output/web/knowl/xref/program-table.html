<figure class="listing figure-like"><figcaption><span class="type">Listing</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">4.5.2<span class="period heading-divison-mark heading-divison-mark__period">.</span></span><span class="space heading-divison-mark heading-divison-mark__space"> </span>TABLE<div class="autopermalink" aria-hidden="true" data-description="Listing 4.5.2: TABLE"><a tabindex="-1" href="#program-table" title="Copy heading and permalink for Listing 4.5.2: TABLE" aria-label="Copy heading and permalink for Listing 4.5.2: TABLE">🔗</a></div></figcaption><div class="listing__contents"><div class="code-box"><pre class="program clipboardable"><code class="language-none">DEF fnf(t) = COS(t^2)

tinitial = 0
tfinal = 4
numberofsteps = 2^3

deltat = (tfinal - tinitial)/numberofsteps

t = tinitial
accumulation = 0

FOR k = 1 TO numberofsteps
    deltay = fnf(t)*deltat
    accumulation = accumulation + deltay
    t = t + deltat

    PRINT deltay, accumulation, t
NEXT k
</code></pre></div></div>
